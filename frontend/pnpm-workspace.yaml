minimumReleaseAgeExclude:
  - vite@8.1.5
shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver

catalogs:
  build:
    vite: ^8.2.2

  css:
    unocss: ^66.9.1

  frontend:
    '@vue/devtools-api': ^8.2.1
    pinia: ^4.0.3
    pinia-plugin-persistedstate: ^4.7.1
    vue: ^3.5.42
    vue-i18n: ^11.4.10
    vue-router: ^5.3.0

  icons:
    '@iconify-json/flag': ^1.2.12
    '@iconify-json/lucide': ^1.2.128

  lint:
    '@antfu/eslint-config': ^9.4.0
    eslint: ^10.9.1

  plugins:
    '@intlify/unplugin-vue-i18n': ^11.2.5
    '@vitejs/plugin-vue': ^6.0.8
    '@vitejs/plugin-vue-jsx': ^5.1.6
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0

  types:
    '@types/node': ^26.4.1
    '@vue/tsconfig': ^0.9.1
    typescript: 6.0.3

  ui:
    naive-ui: ^2.45.3

  utils:
    '@ctrl/tinycolor': ^4.2.0
    '@vueuse/core': ^14.4.0
    dayjs: ^1.11.23

allowBuilds:
  esbuild: true
